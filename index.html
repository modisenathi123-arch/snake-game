<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Snake Classic</title>
    <!-- Tailwind CSS for modern UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            touch-action: manipulation;
            transition: background-color 0.4s ease;
        }
        .neon-text-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.6); }
        
        /* Canvas styling */
        canvas {
            image-rendering: pixelated;
            background-color: #0b1329;
            border-radius: 1rem;
            transition: background-color 0.4s ease;
        }

        /* D-Pad touch button styling */
        .d-pad-btn {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            box-shadow: 3px 3px 6px #090d16, -3px -3px 6px #1f2d48;
            transition: all 0.1s ease;
        }
        .d-pad-btn:active {
            box-shadow: inset 2px 2px 5px #090d16, inset -2px -2px 5px #1f2d48;
            transform: scale(0.95);
        }
    </style>
</head>
<body id="page-body" class="text-slate-100 flex flex-col items-center justify-between p-4 min-h-screen">

    <!-- Header Section -->
    <header class="w-full max-w-lg text-center my-2">
        <h1 class="text-4xl sm:text-5xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-fuchsia-500 neon-text-cyan">
            SNAKE <span class="text-xs uppercase px-2 py-1 bg-cyan-950 border border-cyan-500/30 rounded-md text-cyan-300 align-middle">Arcade</span>
        </h1>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-md flex flex-col items-center">
        
        <!-- Score Board & Control Bar -->
        <div class="w-full bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl p-4 mb-4 flex justify-between items-center shadow-xl">
            <!-- Current Score & Level -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
                    <span class="text-lg">🍎</span>
                </div>
                <div>
                    <div class="text-xs text-slate-400 uppercase font-semibold">Score / <span id="level-label" class="text-fuchsia-400">Lvl 1</span></div>
                    <div id="score" class="text-2xl font-extrabold text-cyan-400">0</div>
                </div>
            </div>

            <!-- High Score -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                    <i class="fa-solid fa-trophy text-lg"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-400 uppercase font-semibold">Best</div>
                    <div id="high-score" class="text-2xl font-extrabold text-amber-400">0</div>
                </div>
            </div>

            <!-- Audio Toggle Button -->
            <button id="sound-btn" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition border border-slate-700" title="Toggle Sound">
                <i id="sound-icon" class="fa-solid fa-volume-high"></i>
            </button>
        </div>

        <!-- Canvas Game Screen Holder -->
        <div class="relative w-full aspect-square bg-slate-900 rounded-2xl p-2 border border-slate-800">
            <canvas id="gameCanvas" class="w-full h-full"></canvas>

            <!-- Overlay Screen (Start / Game Over / Pause) -->
            <div id="game-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center z-10 transition-all duration-300">
                <div id="overlay-icon" class="w-16 h-16 rounded-full bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-cyan-400 text-3xl mb-4">
                    <i class="fa-solid fa-play ml-1"></i>
                </div>
                <h2 id="overlay-title" class="text-3xl font-extrabold mb-2 text-white">READY TO PLAY?</h2>
                <p id="overlay-subtitle" class="text-slate-400 text-sm mb-6 max-w-xs">3 Levels, Obstacles, Wrap-around walls & Color-shifting backgrounds!</p>
                <button id="main-action-btn" class="px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/30 transform hover:-translate-y-0.5 active:translate-y-0 transition">
                    START GAME
                </button>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="w-full flex justify-between items-center gap-3 mt-4">
            <button id="pause-btn" disabled class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-slate-200 font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-pause"></i> Pause
            </button>
            <button id="restart-btn" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> Restart
            </button>
        </div>

        <!-- On-screen D-Pad Touch Controls -->
        <div class="w-full mt-4 flex flex-col items-center">
            <div class="grid grid-cols-3 gap-2 w-48 h-48">
                <div></div>
                <button id="btn-up" class="d-pad-btn rounded-t-2xl text-slate-300 hover:text-cyan-400 text-2xl flex items-center justify-center">
                    <i class="fa-solid fa-caret-up"></i>
                </button>
                <div></div>
                <button id="btn-left" class="d-pad-btn rounded-l-2xl text-slate-300 hover:text-cyan-400 text-2xl flex items-center justify-center">
                    <i class="fa-solid fa-caret-left"></i>
                </button>
                <div class="d-pad-btn rounded-lg bg-slate-900/50 flex items-center justify-center text-slate-600 text-xs font-bold">
                    D-PAD
                </div>
                <button id="btn-right" class="d-pad-btn rounded-r-2xl text-slate-300 hover:text-cyan-400 text-2xl flex items-center justify-center">
                    <i class="fa-solid fa-caret-right"></i>
                </button>
                <div></div>
                <button id="btn-down" class="d-pad-btn rounded-b-2xl text-slate-300 hover:text-cyan-400 text-2xl flex items-center justify-center">
                    <i class="fa-solid fa-caret-down"></i>
                </button>
                <div></div>
            </div>
        </div>
    </main>

    <!-- Footer with Working Text-Based Player Counter -->
    <footer class="mt-6 text-slate-400 text-xs text-center flex flex-col items-center gap-2">
        <span>Classic Snake Arcade Game &bull; Built with Canvas</span>
        <div class="bg-slate-900/80 px-4 py-1.5 rounded-lg border border-slate-800 flex items-center gap-2">
            <span class="text-slate-400">Total Game Sessions:</span>
            <span id="visit-counter" class="font-bold text-cyan-400">1</span>
        </div>
    </footer>

    <!-- Game JavaScript -->
    <script>
        let visits = parseInt(localStorage.getItem('snake_total_visits') || '0', 10) + 1;
        localStorage.setItem('snake_total_visits', visits.toString());
        document.getElementById('visit-counter').textContent = visits;

        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
            }
            playEatSound() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
            playLevelUpSound() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.setValueAtTime(600, this.ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playGameOverSound() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        const sound = new SoundEffects();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pageBody = document.getElementById('page-body');

        const GRID_SIZE = 20;
        let CELL_SIZE = 20;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let score = 0;
        let level = 1;
        let applesEatenInLevel = 0;
        let highScore = parseInt(localStorage.getItem('snake_high_score') || '0', 10);
        let gameLoopId = null;
        let isRunning = false;
        let isPaused = false;
        
        let baseSpeed = 150;
        let speed = 150;

        const bgColors = [
            { bg: '#2b0c0c', canvas: '#1a0505' }, // Red theme
            { bg: '#050505', canvas: '#000000' }, // Black theme
            { bg: '#334155', canvas: '#1e293b' }, // White/Slate theme
            { bg: '#062812', canvas: '#021508' }, // Green theme
            { bg: '#0c1b33', canvas: '#050f1f' }  // Blue theme
        ];
        let colorIndex = 0;

        const scoreElem = document.getElementById('score');
        const levelLabel = document.getElementById('level-label');
        const highScoreElem = document.getElementById('high-score');
        const overlay = document.getElementById('game-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const overlayIcon = document.getElementById('overlay-icon');
        const mainActionBtn = document.getElementById('main-action-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const restartBtn = document.getElementById('restart-btn');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');

        highScoreElem.textContent = highScore;

        function getObstacles() {
            if (level === 1) {
                return [{x: 7, y: 10}, {x: 8, y: 10}, {x: 9, y: 10}, {x: 10, y: 10}, {x: 11, y: 10}, {x: 12, y: 10}];
            } else if (level === 2) {
                return [
                    {x: 5, y: 5}, {x: 5, y: 6}, {x: 5, y: 7},
                    {x: 14, y: 12}, {x: 14, y: 13}, {x: 14, y: 14}
                ];
            } else if (level >= 3) {
                return [
                    {x: 6, y: 6}, {x: 13, y: 6},
                    {x: 10, y: 10},
                    {x: 6, y: 13}, {x: 13, y: 13}
                ];
            }
            return [];
        }

        function resizeCanvas() {
            const containerWidth = canvas.parentElement.clientWidth - 16;
            canvas.width = containerWidth;
            canvas.height = containerWidth;
            CELL_SIZE = canvas.width / GRID_SIZE;
            if (isRunning || isPaused) {
                draw();
            } else {
                drawGridOnly();
            }
        }
        window.addEventListener('resize', resizeCanvas);

        function updateTheme() {
            const theme = bgColors[colorIndex % bgColors.length];
            pageBody.style.background = theme.bg;
            canvas.style.backgroundColor = theme.canvas;
        }

        function initGame() {
            snake = [
                { x: 10, y: 15 },
                { x: 9, y: 15 },
                { x: 8, y: 15 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            level = 1;
            applesEatenInLevel = 0;
            speed = baseSpeed;
            colorIndex = 0;
            updateTheme();
            scoreElem.textContent = score;
            levelLabel.textContent = `Lvl ${level}`;
            spawnFood();
        }

        function spawnFood() {
            let valid = false;
            const obstacles = getObstacles();
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                
                const hitSnake = snake.some(segment => segment.x === food.x && segment.y === food.y);
                const hitObstacle = obstacles.some(obs => obs.x === food.x && obs.y === food.y);
                
                if (!hitSnake && !hitObstacle) {
                    valid = true;
                }
            }
        }

        function startGame() {
            initGame();
            isRunning = true;
            isPaused = false;
            overlay.classList.add('hidden');
            pauseBtn.disabled = false;
            pauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(gameStep, speed);
        }

        function pauseGame() {
            if (!isRunning) return;
            if (isPaused) {
                isPaused = false;
                overlay.classList.add('hidden');
                pauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
                gameLoopId = setInterval(gameStep, speed);
            } else {
                isPaused = true;
                clearInterval(gameLoopId);
                overlayTitle.textContent = "GAME PAUSED";
                overlaySubtitle.textContent = "Take a break and jump right back in.";
                overlayIcon.innerHTML = '<i class="fa-solid fa-pause"></i>';
                mainActionBtn.textContent = "RESUME";
                overlay.classList.remove('hidden');
                pauseBtn.innerHTML = '<i class="fa-solid fa-play"></i> Resume';
            }
        }

        function gameOver() {
            isRunning = false;
            isPaused = false;
            clearInterval(gameLoopId);
            pauseBtn.disabled = true;
            sound.playGameOverSound();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_high_score', highScore.toString());
                highScoreElem.textContent = highScore;
            }

            overlayTitle.textContent = "GAME OVER";
            overlaySubtitle.textContent = `Final Score: ${score} | Reached Level ${level}`;
            overlayIcon.innerHTML = '<i class="fa-solid fa-skull"></i>';
            mainActionBtn.textContent = "PLAY AGAIN";
            overlay.classList.remove('hidden');
        }

        function gameStep() {
            dx = nextDx;
            dy = nextDy;
            let headX = snake[0].x + dx;
            let headY = snake[0].y + dy;

            if (headX < 0) headX = GRID_SIZE - 1;
            else if (headX >= GRID_SIZE) headX = 0;

            if (headY < 0) headY = GRID_SIZE - 1;
            else if (headY >= GRID_SIZE) headY = 0;

            const head = { x: headX, y: headY };

            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            const obstacles = getObstacles();
            if (obstacles.some(obs => obs.x === head.x && obs.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                applesEatenInLevel++;
                scoreElem.textContent = score;
                sound.playEatSound();
                
                colorIndex++;
                updateTheme();

                if (applesEatenInLevel >= 3 && level < 3) {
                    level++;
                    applesEatenInLevel = 0;
                    levelLabel.textContent = `Lvl ${level}`;
                    sound.playLevelUpSound();
                    speed = Math.max(70, speed - 15);
                    clearInterval(gameLoopId);
                    gameLoopId = setInterval(gameStep, speed);
                }

                spawnFood();
            } else {
                snake.pop();
            }
            draw();
        }

        function drawGridOnly() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawObstacles();
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
        }

        function drawObstacles() {
            const obstacles = getObstacles();
            obstacles.forEach(obs => {
                const x = obs.x * CELL_SIZE;
                const y = obs.y * CELL_SIZE;
                ctx.save();
                ctx.fillStyle = '#f59e0b';
                ctx.shadowColor = '#d97706';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.roundRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 4);
                ctx.fill();
                ctx.restore();
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawObstacles();

            const foodX = food.x * CELL_SIZE + CELL_SIZE / 2;
            const foodY = food.y * CELL_SIZE + CELL_SIZE / 2;
            const radius = CELL_SIZE / 2.5;

            ctx.save();
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(foodX, foodY, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            snake.forEach((segment, index) => {
                const x = segment.x * CELL_SIZE;
                const y = segment.y * CELL_SIZE;
                const isHead = index === 0;

                ctx.save();
                if (isHead) {
                    ctx.fillStyle = '#22d3ee';
                    ctx.shadowColor = '#06b6d4';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.roundRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2, 6);
                    ctx.fill();
                } else {
                    const opacity = Math.max(0.3, 1 - (index / snake.length) * 0.6);
                    ctx.fillStyle = `rgba(16, 185, 129, ${opacity})`;
                    ctx.beginPath();
                    ctx.roundRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 4);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        function changeDirection(newDx, newDy) {
            if (newDx === -dx && newDx !== 0) return;
            if (newDy === -dy && newDy !== 0) return;
            nextDx = newDx;
            nextDy = newDy;
        }

        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': changeDirection(0, -1); break;
                case 'ArrowDown': case 's': case 'S': changeDirection(0, 1); break;
                case 'ArrowLeft': case 'a': case 'A': changeDirection(-1, 0); break;
                case 'ArrowRight': case 'd': case 'D': changeDirection(1, 0); break;
                case ' ':
                    if (!isRunning && overlay.style.display !== 'none') {
                        startGame();
                    } else if (isRunning) {
                        pauseGame();
                    }
                    break;
            }
        });

        document.getElementById('btn-up').addEventListener('click', () => changeDirection(0, -1));
        document.getElementById('btn-down').addEventListener('click', () => changeDirection(0, 1));
        document.getElementById('btn-left').addEventListener('click', () => changeDirection(-1, 0));
        document.getElementById('btn-right').addEventListener('click', () => changeDirection(1, 0));

        mainActionBtn.addEventListener('click', () => {
            if (isPaused) {
                pauseGame();
            } else {
                startGame();
            }
        });

        pauseBtn.addEventListener('click', pauseGame);
        restartBtn.addEventListener('click', () => { startGame(); });

        soundBtn.addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            if (sound.enabled) {
                soundIcon.className = "fa-solid fa-volume-high text-cyan-400";
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark text-slate-500";
            }
        });

        window.onload = () => { resizeCanvas(); };
    </script>
</body>
</html>
